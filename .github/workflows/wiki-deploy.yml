# Build and deploy the Flynnel wiki (Hugo + Hextra) to GitHub Pages.
#
# Adapted from the canonical hextra-starter-template pages.yaml
# (github.com/imfing/hextra-starter-template/.github/workflows/pages.yaml).
# Two deltas vs. the upstream starter:
#   1. Trigger paths: only fires on wiki/** or this workflow's own
#      changes, so the rest of the repo can push without triggering
#      a docs rebuild.
#   2. Working directory: the Hugo site lives at wiki/ in this repo
#      (not at the repo root). The setup-pages, build, and
#      upload-artifact steps all scope to that subdirectory.
name: Deploy Flynnel Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Do NOT cancel in-progress
# runs so production deployments complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build with Hugo
        working-directory: ./wiki
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
