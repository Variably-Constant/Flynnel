[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# House test profile: release-grade codegen without LTO so test
# sweeps compile fast and land in their own target/release-test
# tree instead of target/debug.
[profile.release-test]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
