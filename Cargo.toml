[package]
name = "flynnel"
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
description = "K-aware NUMA-aware work-stealing scheduler with extended-Flynn-taxonomy dispatch (MIMD / SIMC / MIMC / MISD / SIMT / MIMT): a rayon-shaped pool reshaped around per-call execution-class plans with first-class CPU+GPU hybrid (join_hybrid, hybrid_pipeline) and per-call dispatch profiles."
license = "MIT"
repository = "https://github.com/Variably-Constant/Flynnel"
documentation = "https://docs.rs/flynnel"
readme = "README.md"
keywords = ["scheduler", "work-stealing", "parallel", "numa", "simd"]
categories = ["concurrency", "asynchronous"]
# Explicit example / bench declarations only. Autodiscovery on
# `examples/` would list files that `exclude` below removes from
# the published tarball, producing a `cargo package` warning; the
# explicit list keeps the on-disk workspace and the packaged crate
# in agreement.
autoexamples = false

# Files kept OUT of the crates.io tarball. The wiki lives on GitHub
# Wiki; agent-instruction docs are for local tooling; hidden
# directories carry issue-tracker / IDE state that has no place in a
# published package. `assets/*.psd` drops the ~9 MiB Photoshop
# source; the .png logos ship so consumers can render the README's
# branding without a network fetch.
exclude = [
    "/.claude/**",
    "/.github/**",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/assets/*.psd",
    "/wiki/**",
    "/examples/audit_real_workloads_routing.rs",
    "/examples/classifier_audit.rs",
    "/examples/observe_grep.rs",
    "/examples/observe_workloads.rs",
    "/examples/probe_k_gating.rs",
    "/examples/migrate_observability.rs",
    "/examples/analyze_trace.py",
    "/examples/pair_orders.py",
    "/examples/lever_report.py",
    "/examples/profile_draws_report.py",
    "/examples/smt_report.py",
    "/examples/lever_rounds.sh",
    "/examples/width_report.py",
    "/examples/width_rounds.sh",
    "/examples/trace_real_grep.rs",
    "/kaggle/**",
    "/tpu/**",
    "/pwrs/**",
]

[dependencies]
# Per-thread CPU affinity pinning. Non-optional so the pinning code
# path is available in every build; on platforms where pinning is
# unsupported the calls degrade to OS-managed placement.
core_affinity = "0.8.3"
# BLAKE3 hashing for the VerifyChain primitive (CPU/GPU bit-exact
# trace verification). Optional because not every consumer needs the
# verification surface; gate with the `verify-chain` feature.
blake3 = { version = "1.8.7", optional = true }
# Cross-platform dlopen wrapper used by `crate::backend::detect` to
# probe whether GPU runtimes (libcuda, libamdhip64) are loadable on
# the host WITHOUT linking the SDK at build time. ~50 KB no-deps
# crate; non-optional because detection is a stable surface and the
# binary cost is trivial.
libloading = "0.9.0"
# CUDA reference backend (optional). cudarc with the
# `fallback-dynamic-loading` feature dlopens libcuda at runtime, so no
# nvcc or CUDA SDK is required at build time. The `cuda-13010` feature
# selects cudarc's bindings for the CUDA 13.1 driver API.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["fallback-dynamic-loading", "driver", "nvrtc", "cuda-13010"] }
# TPU JAX reference backend (optional). Spawns a Python child
# process running the embedded `tpu_jax_bridge.py` script and talks
# to it over line-oriented JSON on stdin/stdout. No JAX dep at
# build time; the host needs python3 + jax installed at runtime
# for kernel launches to succeed (detection probe + graceful
# degradation when missing).
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
# WebAssembly reference backend (optional). wasmtime is a pure-Rust
# embeddable WASM runtime; no system shared library is required at
# build or run time. Gated by `wasm-reference` so hosts that do not
# need WASM dispatch do not pull it in.
wasmtime = { version = "49.0.1", optional = true, default-features = false, features = ["cranelift", "runtime"] }
# Memory-mapped file primitive used by the shared-memory worker
# backend. Pure-Rust, no system library at build time; relies on
# OS mmap (POSIX) / CreateFileMapping (Windows) at runtime. Gated
# by `shared-memory-worker-reference` so hosts that do not need
# cross-process dispatch do not pull it in.
memmap2 = { version = "0.9.11", optional = true }

[dev-dependencies]
# Reference scheduler for the taxonomy Flynnel inherits from. Not
# a production dep; only referenced by benches that show flynnel's
# join / for_each_chunk / cooperative surfaces alongside the
# rayon-style API they extend.
rayon = "1.12.0"
# Statistics-driven micro-benchmarking. Used by the criterion
# benches under `benches/` (flynn_axes, inline_collapse). The
# `html_reports` feature is on by default; we keep it for the
# target/criterion/report/index.html dashboard.
criterion = { version = "0.8.2", features = ["html_reports"] }

# Sets the process affinity mask in tests/affinity_follows_process_mask.rs.
# Linux takes sched_setaffinity and FreeBSD cpuset_setaffinity, which
# differ in name, arguments and set type, so the binding crate carries
# both. Windows needs no dependency: that arm declares the two kernel32
# symbols it calls.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"

[features]
# EVERYTHING ON BY DEFAULT (owner directive, 2026-08-04). A release
# build ships the whole substrate - the CUDA backend and the GPU-peer
# MMF among it - because a capability that is compiled out is a
# capability nobody can use, and "default = []" quietly meant no
# consumer had the GPU at all. None of these need a toolkit at BUILD
# time: cudarc dlopens libcuda at runtime and degrades when it is
# absent, and the same is true of the JAX and WASM backends.
#
# Opt OUT with --no-default-features (plus whatever subset you do
# want) for a lean CPU-only build.
default = [
    "verify-chain",
    "cuda-reference",
    "gpu-peer",
    "persisted-calibration",
    "shared-memory-worker-reference",
    "tpu-jax-reference",
    "wasm-reference",
]
# Enable the per-host calibration table
# (`crate::sched::calibration_store`): the measured dispatch thresholds
# and device capabilities live in a memory-mapped file keyed by a host
# stamp, so a process that finds its host's table reads it instead of
# measuring. Pulls in memmap2 for the mapping. Without it every process
# measures for itself, and two processes on one host can disagree by
# more than the decisions those numbers drive.
#
# Scheduler surface, not a reference backend. A build that turns the
# default set off to drop the CUDA, JAX, WASM and GPU-peer backends
# wants this one back:
#   flynnel = { default-features = false,
#               features = ["persisted-calibration"] }
# A process that measures its own calibration is indistinguishable from
# one that read a table, so leaving it off has no visible symptom.
persisted-calibration = ["dep:memmap2"]
# Enable the BLAKE3-rooted verification-chain helper (VerifyChain).
verify-chain = ["dep:blake3"]
# Enable the cudarc-based reference CUDA backend
# (`crate::backend::cuda::CudaBackend`). Pulls in cudarc with
# dynamic-loading so no CUDA SDK is needed at build time; the CUDA
# driver must be present at runtime for kernel launches to succeed.
cuda-reference = ["dep:cudarc"]
# Enable the Python-JAX reference TPU backend
# (`crate::backend::tpu_jax::TpuJaxBackend`). Pulls in serde /
# serde_json for the wire protocol. The host needs python3 + jax
# installed at runtime for kernel launches to succeed; without
# them, `TpuJaxBackend::new` returns BackendError::DeviceUnavailable
# and the routing helper falls back to the CPU backend.
tpu-jax-reference = ["dep:serde", "dep:serde_json"]
# Enable the wasmtime-based reference WebAssembly backend
# (`crate::backend::wasm::WasmBackend`). Pulls in wasmtime with the
# cranelift compiler + runtime. Self-contained: no system runtime
# library required, the WASM engine ships inside the binary.
wasm-reference = ["dep:wasmtime"]
# Enable the GPU-peer substrate (`crate::gpu_peer`): the GPU joins the
# scheduler as a shared-memory peer over a cudarc-registered memory-
# mapped region - Lamport SPSC lanes with doorbell dispatch, host-
# calibrated timing constants (doorbell RTT, clock offset, Fischer
# margin) measured at init on the running machine, and a bounded-
# quantum persistent poller kernel shipped as pre-generated PTX
# (driver-JIT'd; no CUDA toolkit needed at build time).
gpu-peer = ["dep:cudarc", "dep:memmap2"]
# Enable the reference shared-memory worker backend
# (`crate::backend::shared_mem::SharedMemoryChaseLevBackend`). Pulls
# in memmap2 for the memory-mapped Chase-Lev work-stealing deque +
# memory-mapped latch arena that back cross-process dispatch. Each
# peer process pre-registers `closure_id -> handler` via
# `shared_mem::pass_registry::register` at startup so the wire only
# carries `(closure_id, args_inline)`. Per-call cost is 342-881 ns on
# Zen+ depending on the coherence tier vs ~20-50 us for pipe-based IPC.
shared-memory-worker-reference = ["dep:memmap2"]

