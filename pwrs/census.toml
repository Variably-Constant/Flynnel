item = "crate::backend::shared_mem::urd"
reason = "unsafe-or-structural"
note = "a mailbox per thief. Same reasoning; Get-FlynnelCpuInfo reports HasWaitpkg and HasMonitorx so a script can see which waits this host can execute. Every wait now opens with a spin floor of SPIN_BEFORE_WAIT polls and only then reaches whatever monitor wait the host has, WAITPKG or MONITORX, so a publish already in flight is caught at spin latency and reaches no monitor at all. The earlier reading that the monitor wait was slower in three cells of four was taken with no floor, so it was catching wakes the spin would have caught; what the second stage buys is the physical core's issue width handed to an SMT sibling, which those rows cannot see because they time the thief rather than its neighbors. The co-runner group in benches/urd_thief_wait.rs measures that and has not run on any host"

