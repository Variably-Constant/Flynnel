# ---------------------------------------------------------------------
# The backend family: bound as columns, or unreachable from a shell
# ---------------------------------------------------------------------
# pwrs/src/backends.rs binds the inspection surface. What is left falls
# into two groups, kept apart on purpose: things a script cannot reach
# because they take a Rust type it has no way to make, and things that
# surface as a column or an enum rather than under a name of their own.
#
# Nothing here is excused for not being built yet. dispatch_accel and
# AccelReport carry no entry and go on failing the census, because each
# is work rather than an exclusion and an entry would hide that.
#
# cuda_sm_count was nearly hidden exactly that way. The detect subtree
# entry below covers it, and the first draft of that entry claimed it
# was carved out while no carve-out existed - a subtree quietly
# swallowing an item its own note said it did not cover. The per-entry
# coverage count is what showed it: detect covering ten items rather
# than the nine its probes account for. It is bound now, as the SmCount
# and SmCountKnown columns of Flynnel.Backend, so the subtree's reason
# is true of it.

