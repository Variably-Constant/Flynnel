# ---------------------------------------------------------------------
# The persisted calibration store, read and never written
# ---------------------------------------------------------------------
# Its read side is the four store cmdlets. Its write side is carved
# out below, and the distinction is the point rather than an omission:
# the table is shared by every process on the host, so a script
# publishing into it would be handing every future process a
# measurement nothing took. Reading is a report; writing is a claim.

[[entry]]
item = "crate::sched::calibration_store"
reason = "internal-to-another-surface"
note = "read through Get-FlynnelHostStamp, Get-FlynnelCalibrationStore, Get-FlynnelCpuCalibration and Get-FlynnelAccelCalibration, which answer the stamp, the table's presence, the CPU record and one row per accelerator"

[[entry]]
item = "crate::sched::calibration_store::WriterGuard"
reason = "unsafe-or-structural"
note = "holds the table's single-writer lease and must be beaten on a cadence or the lease lapses mid-write. A script holding one across a pipeline would either block every other process's calibration or drop the lease with a half-written record behind it"

