note = "the frontier cost model, bound as Get-FlynnelWavePlan. PlanInputs becomes the cmdlet's parameters and Plan becomes Flynnel.WavePlan, with Frontier exported as Flynnel.Frontier. It is a pure function over costs the caller supplies, so it answers on a host with no device"

[[entry]]
item = "crate::gpu_peer::watchdog"
reason = "internal-to-another-surface"
note = "bound as Get-FlynnelPeerWatchdog, which writes the state and the driver model as one row. DriverModel is exported as Flynnel.DriverModel with an Unknown member, because an unreadable model is a reading and the device is still treated as covered. decide is the rule the row states and detect_with_model is what reads the host for it"
