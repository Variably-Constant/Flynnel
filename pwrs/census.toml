# Every public item of the scheduler that the PowerShell module does
# not bind, and why.
#
# The tool at src/bin/census.rs reads this against the crate's own
# source and the built module's descriptor, and fails when a public
# item is in neither, when an entry names an item that no longer
# exists, or when a reason is not one of the six below.
#
# Six reasons are accepted and nothing else, because a free-text
# reason is where "not yet" hides.
#
#   generic-over-caller-type        the signature is generic over a
#                                   type the caller supplies, which a
#                                   script has no way to name
#   takes-a-rust-closure            reachable only by running a body
#                                   the module owns; the entry has to
#                                   name the cmdlet that reaches it,
#                                   and the tool fails one that does
#                                   not
#   unsafe-or-structural            not public surface a script can
#                                   hold: pub(crate), cfg(test), no
#                                   accessor, or an invariant a script
#                                   cannot maintain
#   internal-to-another-surface     bound through a different family
#   not-in-the-shipped-feature-set  behind a feature this module does
#                                   not ship
#   pending-on-main                 exists on a branch; the entry has
#                                   to name the commit that brings it,
#                                   and the tool fails once that
#                                   commit is an ancestor of HEAD, so
#                                   the reminder cannot be forgotten
#
# An entry covers the item it names and everything beneath it, so a
# type's entry covers its methods and a module's entry covers its
# contents. The longest matching entry wins, which is how one item is
# carved out of a family and given its own reason.
#
# A subtree entry is a claim about every item under it, and the tool
# prints how many each one covered so that claim can be checked. Do not
# reach for one to make a number go down: the count is there to catch
# exactly that.
#
# Note what is not excusable here. pwrs/Cargo.toml takes the scheduler
# with default features, which is all of them, because a PowerShell
# module ships as one artifact with no way to ask for an extra. So the
# gpu_peer and backend::shared_mem families are compiled into this
# module and reachable from nothing - about 450 public items between
# them. That is the opposite of not-in-the-shipped-feature-set: they
# are shipped and they are unbound, which makes them work to do rather
# than entries to write.
#
# This file is a seed. It carries only entries established by reading
# the crate directly. The rest come from running the tool and triaging
# what it reports; an entry written before the tool has named the item
# is a guess, and a guess here is indistinguishable from coverage.

# ---------------------------------------------------------------------
# Closure-taking primitives, each reached by a declared kernel
# ---------------------------------------------------------------------
# A script has no closure to give and this module never runs a script
# block on a worker, so these are exercised by naming a body the module
# owns. Each cmdlet below calls the primitive directly in
# pwrs/src/kernels.rs.

[[entry]]
item = "crate::sched::par_iter::for_each_chunk"
reason = "takes-a-rust-closure"
reaches = "Invoke-FlynnelMap"
note = "fourteen element-wise operations, one closure each; also Update-FlynnelArray, which runs the same body over a pinned buffer"

[[entry]]
item = "crate::sched::par_iter::for_each_chunk_indexed"
reason = "takes-a-rust-closure"
reaches = "Invoke-FlynnelZip"
note = "six pairwise operations; the chunk's start index is what reaches the right operand"

[[entry]]
item = "crate::sched::par_iter::par_map_in_place"
reason = "internal-to-another-surface"
note = "the per-element entry point to the work Invoke-FlynnelMap does through for_each_chunk. It dispatches one task an element, which the crate documents as the shape for few large units; measured at 200,000 doubles that cost 5.21 ms against 0.38 ms chunked, so no kernel here uses it and none should until one has per-element work heavy enough to want it"

[[entry]]
