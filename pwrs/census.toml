# ---------------------------------------------------------------------
# Racing
# ---------------------------------------------------------------------
# MISD: several instructions over one datum. The line through this
# family is whether an arm has to be able to DECLINE, REFUTE or
# DISAGREE with another arm. Every body this module can offer is a
# declared deterministic kernel, which can do none of the three, so
# an arm needing one of them is absent rather than bound to a body
# that cannot fail.
#
# race_any and explore_select are the two that fit a declared body,
# because both take the attempt index and neither asks an arm to
# decline or disagree. Both are bound.

[[entry]]
item = "crate::sched::race::race_any"
reason = "internal-to-another-surface"
note = "bound as Measure-FlynnelRaceAny, which fires several attempts at one declared operation and keeps the first to finish. TailRatio is what the hedge saved on this host: the slowest arm's time over the winner's"

[[entry]]
item = "crate::sched::race::explore_select"
reason = "internal-to-another-surface"
note = "bound as Measure-FlynnelExploreSelect, the complement that runs every arm to completion and picks the fastest. Its comparator is wall time with the earlier index kept on a tie, so the winner is deterministic given deterministic arms"

[[entry]]
item = "crate::sched::race::race_variants"
reason = "takes-a-rust-closure"
reaches = "Measure-FlynnelHybridPlacement"
note = "needs a Fast and a Faithful body that can decline by answering None when their accuracy contract is not met. foundation's Variant is that ladder: Correct is bit-exact, Faithful within one ulp, Fast bounded but unspecified. The declared kernels are f64 operations with no accuracy tiers - Sqrt is the hardware's sqrt and there is no faster body to decline - so every arm would answer Some and the race would degenerate to the first one while reporting a tier it never tested. The two-way learned form of the same idea is bound as Measure-FlynnelHybridPlacement"

[[entry]]
item = "crate::sched::race::race_refute"
reason = "takes-a-rust-closure"
reaches = "Measure-FlynnelHybridPlacement"
note = "needs a prover and a refuter that can reach opposite conclusions about one question. A declared kernel computes a number; it has nothing to refute"

[[entry]]
item = "crate::sched::race::race_agree"
reason = "takes-a-rust-closure"
reaches = "Measure-FlynnelHybridPlacement"
note = "needs explorers that can disagree, and a threshold over how many agreed. Every declared kernel here is deterministic, so every arm agrees by construction and the threshold is met at one arm whatever it is set to. A cmdlet over this would always answer unanimous, which would be a property of the binding and not of the work"

[[entry]]
item = "crate::sched::race::race_quorum"
